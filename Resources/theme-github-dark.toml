# GitHub dark theme (GitHub's dark-default palette). Used when the desktop
# appearance is dark; see OMTheme +defaultThemeForDarkAppearance:.

[base]
font_family = "Helvetica"
font_size = 14
text_color = "#e6edf3"
background = "#0d1117"

[heading]
font_family = "Helvetica-Bold"
color = "#e6edf3"

[code]
font_family = "Menlo"
background = "#151b23"
color = "#e6edf3"
border_color = "#3d444d"

[blockquote]
border_color = "#3d444d"
text_color = "#9198a1"

[link]
color = "#4493f8"

[hr]
color = "#3d444d"
