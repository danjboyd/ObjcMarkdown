name: linux-flatpak

# MarkdownViewer as a Flatpak bundle (#67), from
# packaging/flatpak/io.github.danjboyd.MarkdownViewer.yml: by hand, or on a
# release tag, which attaches the bundle to the release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional version to build (for example 0.2.3 or 0.2.3-rc1); a tag's otherwise.
        required: false
        type: string

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A release's version from its tag, so About matches the package (#119).
      - name: Version from the tag
        shell: bash
        run: ./packaging/ci/set-version.sh '${{ github.event.inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}'

      - name: Build the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.danjboyd.MarkdownViewer.yml
          bundle: MarkdownViewer.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/io.github.danjboyd.MarkdownViewer.yml') }}
          upload-artifact: true

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # A release candidate is a pre-release, so GitHub's latest release
          # (which the AppImage's zsync update information follows) stays
          # the last real one.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The Linux-only 0.2.5.x hotfixes leave 0.2.5 the Latest release,
          # for the Windows and macOS downloads.
          make_latest: ${{ startsWith(github.ref_name, 'v0.2.5.') && 'false' || 'legacy' }}
          files: MarkdownViewer.flatpak
