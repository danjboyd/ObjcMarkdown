name: ci-image

# Builds the Linux CI image (ci/linux/Dockerfile) and pushes it to GHCR as
# ghcr.io/danjboyd/objcmarkdown-ci. linux-gnustep-clang.yml runs in it,
# pinned by the digest this prints; update that pin after a rebuild.
on:
  push:
    paths:
      - ci/linux/**
      - .github/workflows/ci-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ci/linux
          push: true
          tags: |
            ghcr.io/danjboyd/objcmarkdown-ci:${{ github.sha }}
            ${{ github.ref_name == 'main' && 'ghcr.io/danjboyd/objcmarkdown-ci:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the digest
        shell: bash
        run: |
          {
            echo "### CI image"
            echo
            echo "Pin \`linux-gnustep-clang.yml\` to:"
            echo
            echo '```'
            echo "ghcr.io/danjboyd/objcmarkdown-ci@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}"
