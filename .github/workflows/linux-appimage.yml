name: linux-appimage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional version to package (for example 0.1.0 or 0.1.1-rc2).
        required: false
        type: string

permissions:
  contents: write
  # Pulling the CI image the AppImage job runs in.
  packages: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ github.event.inputs.version }}'
          if [[ -z "$version" && '${{ github.ref_type }}' == 'tag' ]]; then
            version='${{ github.ref_name }}'
          fi
          version="${version#v}"
          printf 'package_version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build-appimage:
    needs: resolve-version
    uses: danjboyd/gnustep-packager/.github/workflows/package-gnustep-app.yml@b358b2a7416942df10099dd3856f9b46dabef5a9
    with:
      manifest-path: packaging/manifests/linux-appimage.manifest.json
      backend: appimage
      package-version: ${{ needs.resolve-version.outputs.package_version }}
      packager-repository: danjboyd/gnustep-packager
      packager-ref: b358b2a7416942df10099dd3856f9b46dabef5a9
      # GitHub-hosted, in the CI image (ci/linux/Dockerfile), pinned by the
      # digest linux-gnustep-clang.yml uses.
      container-appimage: ghcr.io/danjboyd/objcmarkdown-ci@sha256:aaa9fa72af8045bc6d343027ab38b9420513f712512e20c44752fff82a65e0a0
      skip-default-host-setup: true
      # The CI image already has the AppImage tools; the packager rejects
      # extra apt packages when it does not set up the host.
      appimage-apt-packages: ""
      preflight-shell: bash
      preflight-command: ./packaging/ci/preflight-appimage.sh
      run-validation: true
      run-smoke: true
      upload-artifacts: true
      artifact-name: objcmarkdown-linux

  publish-release-assets:
    if: github.ref_type == 'tag'
    needs:
      - build-appimage
    runs-on: ubuntu-latest
    concurrency:
      group: objcmarkdown-update-feeds
      cancel-in-progress: false
    steps:
      - name: Checkout Feed Publisher
        uses: actions/checkout@v4

      - name: Download Linux Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: objcmarkdown-linux-packages
          path: dist/linux

      # Each payload in the feed gets an Ed25519 signature (edSignature),
      # made with the key Sparkle signs the macOS updates with; copies whose
      # update config has the public key refuse an unsigned payload.
      - name: Sign Linux Update Feed
        shell: bash
        env:
          UPDATE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export UPDATE_ED_PUBLIC_KEY="$(python3 -c 'import plistlib; print(plistlib.load(open("macos/Info.plist", "rb"))["SUPublicEDKey"])')"
          for feed in dist/linux/*.update-feed.json; do
            python3 packaging/ci/sign-update-feed.py "$feed" dist/linux
          done

      - name: Stage Linux Release Assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/linux/*.AppImage release-assets/
          if compgen -G 'dist/linux/*.AppImage.zsync' > /dev/null; then
            cp dist/linux/*.AppImage.zsync release-assets/
          fi
          if compgen -G 'dist/linux/*.update-feed.json' > /dev/null; then
            cp dist/linux/*.update-feed.json release-assets/
          fi
          if compgen -G 'dist/linux/*.metadata.json' > /dev/null; then
            cp dist/linux/*.metadata.json release-assets/
          fi
          if compgen -G 'dist/linux/*.diagnostics.txt' > /dev/null; then
            cp dist/linux/*.diagnostics.txt release-assets/
          fi

      - name: Note Bundled Theme
        shell: bash
        run: |
          set -euo pipefail
          python3 - packaging/inputs.json > release-theme-notes.md <<'PY'
          import json, sys
          for item in json.load(open(sys.argv[1]))["inputs"]:
              if item["id"] == "linux-adwaita-theme":
                  print("Linux bundles the Adwaita theme from %s at `%s` (%s)."
                        % (item["repo"], item["ref"], item.get("refName", item["ref"])))
          PY
          cat release-theme-notes.md

      - name: Publish Linux Release Assets
        uses: softprops/action-gh-release@v2
        with:
          # A release candidate is a pre-release, so GitHub's latest release
          # (which the AppImage's zsync update information follows) stays
          # the last real one.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
          body_path: release-theme-notes.md
          append_body: true

      # Releases only: a release candidate (a tag with "-") isn't offered
      # to installed copies as an update.
      - name: Publish Linux Stable Update Feed
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packaging/ci/publish-update-feed.sh linux dist/linux
