name: macos

# Builds and tests the macOS app on every push and pull request; for a
# version tag, also attaches its disk image to the release. The app is
# ad-hoc signed, not notarized (there is no Developer ID yet), so macOS
# asks before the first open; the release notes say how.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version to package (for example 0.1.0 or 0.1.1-rc2).
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ github.event.inputs.version }}'
          if [[ -z "$version" && '${{ github.ref_type }}' == 'tag' ]]; then
            version='${{ github.ref_name }}'
          fi
          if [[ -z "$version" ]]; then
            version="$(cat VERSION)"
          fi
          version="${version#v}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun clang --version

      - name: Build (universal) and run tests
        run: |
          make -C macos -j"$(sysctl -n hw.ncpu)" OMD_WERROR=1 \
            OMD_VERSION='${{ steps.version.outputs.version }}' \
            BUILD_NUMBER='${{ github.run_number }}' all test

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          app=macos/build/MarkdownViewer.app
          lipo -archs "$app/Contents/MacOS/MarkdownViewer"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/MarkdownViewer" "$PWD/Resources/sample-commonmark.md" &
          pid=$!
          sleep 10
          # Still running: it launched, opened the document and rendered.
          kill -0 "$pid"
          kill "$pid"

      - name: Disk image
        run: |
          make -C macos OMD_VERSION='${{ steps.version.outputs.version }}' \
            BUILD_NUMBER='${{ github.run_number }}' dmg

      # Sparkle's feed for this release: the disk image, signed with the
      # project's EdDSA key (the app holds the public half, SUPublicEDKey).
      - name: Update feed
        if: github.ref_type == 'tag'
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          dmg="macos/build/MarkdownViewer-${version}-macos.dmg"
          sparkle_dir="$(make -s -C macos print-sparkle-dir)"
          enclosure="$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$sparkle_dir/bin/sign_update" --ed-key-file - "$dmg")"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$dmg")"
          short="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' macos/build/MarkdownViewer.app/Contents/Info.plist)"
          cat > macos/build/MarkdownViewer.appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>MarkdownViewer</title>
              <link>https://github.com/${GITHUB_REPOSITORY}</link>
              <item>
                <title>${version}</title>
                <link>https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}</link>
                <sparkle:version>${{ github.run_number }}</sparkle:version>
                <sparkle:shortVersionString>${short}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>11.0</sparkle:minimumSystemVersion>
                <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <enclosure url="${url}" ${enclosure} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
          cat macos/build/MarkdownViewer.appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: objcmarkdown-macos
          path: |
            macos/build/*.dmg
            macos/build/*.appcast.xml
          if-no-files-found: error

  publish-release-assets:
    if: github.ref_type == 'tag'
    needs:
      - build-and-test
    runs-on: ubuntu-latest
    # The other platforms publish to the same release.
    concurrency:
      group: objcmarkdown-update-feeds
      cancel-in-progress: false
    steps:
      # The feed publisher script.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: objcmarkdown-macos
          path: dist/macos

      - name: macOS release notes
        shell: bash
        run: |
          cat > release-macos-notes.md <<'EOF'
          macOS: `MarkdownViewer-*-macos.dmg` is a universal app (Apple silicon and Intel, macOS 11 or later). It isn't notarized yet, so macOS blocks the first open: drag the app to Applications, open it, then choose Open Anyway in System Settings > Privacy & Security (on macOS 14 and earlier, Control-click the app and choose Open).
          EOF

      - name: Publish macOS release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/macos/*.dmg
          body_path: release-macos-notes.md
          append_body: true

      # Sparkle's feed at updates/macos/appcast.xml on GitHub Pages, for
      # releases only: a release candidate (a tag with "-") isn't offered
      # to the app as an update.
      - name: Publish macOS update feed
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packaging/ci/publish-update-feed.sh macos dist/macos
