name: linux-gnustep-clang

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    # GitHub-hosted, in the CI image (ci/linux/Dockerfile, built by
    # ci-image.yml) pinned by digest: update the pin when the image changes.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/danjboyd/objcmarkdown-ci@sha256:cc15f3cd5f902884a32413a6f4349ad8075deb8def997ac686611b21d1f7308b
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        shell: bash
        run: cat /usr/GNUstep/ci-toolchain.txt

      - name: Build and run tests
        shell: bash
        run: |
          set -euo pipefail
          # The GUI tests need a display.
          xvfb-run -a ./scripts/ci/run-linux-ci.sh
