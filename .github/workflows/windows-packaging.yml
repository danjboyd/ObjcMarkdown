name: windows-packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional version to package (for example 0.1.0, 0.1.1-rc2, or v0.1.0).
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ github.event.inputs.version }}'
          if [[ -z "$version" && '${{ github.ref_type }}' == 'tag' ]]; then
            version='${{ github.ref_name }}'
          fi
          version="${version#v}"
          printf 'package_version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build-msi:
    needs: resolve-version
    uses: danjboyd/gnustep-packager/.github/workflows/package-gnustep-app.yml@v0.1.3
    with:
      manifest-path: packaging/manifests/windows-msi.manifest.json
      backend: msi
      package-version: ${{ needs.resolve-version.outputs.package_version }}
      # VERSION from the tag before the build (Git Bash on the runner), so
      # the app's About and Info-gnustep.plist match the MSI (#119).
      preflight-shell: bash
      preflight-command: ./packaging/ci/set-version.sh '${{ needs.resolve-version.outputs.package_version }}'
      # danjboyd/libs-back's carry branch in place of the stock 0.32 backend:
      # WinUITheme draws window tabs in the title bar, Windows' shadows and
      # per-monitor DPI only with it. ScreenshotTool's MSI ships the same.
      msys2-package-urls: >-
        https://github.com/danjboyd/libs-back/releases/download/carry-0.32.0.4/mingw-w64-clang-x86_64-gnustep-back-0.32.0.4-1-any.pkg.tar.zst
      run-validation: true
      run-smoke: true
      upload-artifacts: true
      artifact-name: objcmarkdown-windows
    secrets: inherit

  # Every DLL the packaged exes and DLLs import (the provisioned theme's
  # too) must be in the payload or System32 (packaging/ci/check-windows-imports.ps1).
  check-imports:
    needs: build-msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: objcmarkdown-windows-packages
          path: dist/windows

      - name: Check Imports in the Portable Payload
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem dist/windows -Filter '*-portable.zip')
          if ($zip.Count -ne 1) { throw "Expected one portable zip, found $($zip.Count)." }
          $root = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive -Path $zip[0].FullName -DestinationPath $root
          ./packaging/ci/check-windows-imports.ps1 -PayloadRoot $root

  publish-release-assets:
    if: github.ref_type == 'tag'
    needs:
      - build-msi
      - check-imports
    runs-on: ubuntu-latest
    concurrency:
      group: objcmarkdown-update-feeds
      cancel-in-progress: false
    steps:
      - name: Checkout Feed Publisher
        uses: actions/checkout@v4

      - name: Download Windows Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: objcmarkdown-windows-packages
          path: dist/windows

      # Each payload in the feed gets an Ed25519 signature (edSignature),
      # made with the key Sparkle signs the macOS updates with; copies whose
      # update config has the public key refuse an unsigned payload.
      - name: Sign Windows Update Feed
        shell: bash
        env:
          UPDATE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export UPDATE_ED_PUBLIC_KEY="$(python3 -c 'import plistlib; print(plistlib.load(open("macos/Info.plist", "rb"))["SUPublicEDKey"])')"
          for feed in dist/windows/*.update-feed.json; do
            python3 packaging/ci/sign-update-feed.py "$feed" dist/windows
          done

      - name: Stage Windows Release Assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/windows/*.msi release-assets/
          if compgen -G 'dist/windows/*-portable.zip' > /dev/null; then
            cp dist/windows/*-portable.zip release-assets/
          fi
          if compgen -G 'dist/windows/*.update-feed.json' > /dev/null; then
            cp dist/windows/*.update-feed.json release-assets/
          fi
          if compgen -G 'dist/windows/*.metadata.json' > /dev/null; then
            cp dist/windows/*.metadata.json release-assets/
          fi
          if compgen -G 'dist/windows/*.diagnostics.txt' > /dev/null; then
            cp dist/windows/*.diagnostics.txt release-assets/
          fi

      - name: Publish Windows Release Assets
        uses: softprops/action-gh-release@v2
        with:
          # A release candidate is a pre-release, so GitHub's latest release
          # (which the AppImage's zsync update information follows) stays
          # the last real one.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*

      # Releases only: a release candidate (a tag with "-") isn't offered
      # to installed copies as an update.
      - name: Publish Windows Stable Update Feed
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packaging/ci/publish-update-feed.sh windows dist/windows
